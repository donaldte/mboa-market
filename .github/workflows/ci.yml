# La CI de Mboa Market : à chaque push, GitHub démarre la boutique sur une machine NEUVE, à partir du
# dépôt seul. Si un fichier manque dans Git (« ça marche chez moi »), c'est ici que ça casse.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boutique:
    name: La boutique démarre depuis le dépôt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Rien de secret dans le dépôt
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.sql\.gz$'; then
            echo "::error::Un fichier secret est dans Git (au-dessus) : git rm --cached, puis change les mots de passe."
            exit 1
          fi

      - name: Des secrets de test (jamais les vrais)
        run: |
          cp .env.exemple .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s|^DOSSIER_SAUVEGARDES=.*|DOSSIER_SAUVEGARDES=$RUNNER_TEMP/sauvegardes|" .env

      - name: Le fichier compose est valide
        run: docker compose config --quiet

      - name: Construire et démarrer les six services
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: La boutique répond à travers Traefik
        run: |
          # Traefik ajoute une route quelques secondes après que le service est « healthy » : on l'attend.
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8083/api/sante 2> /dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8083/ | grep -q "Mboa Market"
          curl -fsS http://127.0.0.1:8083/api/sante | tee /dev/stderr | grep -q '"etat":"ok"'
          curl -fsS -o /dev/null -D - http://127.0.0.1:8083/api/produits | grep -i '^x-cache'
          curl -fsS -o /dev/null -D - http://127.0.0.1:8083/api/produits | grep -iq '^x-cache: HIT'
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"nom": "Savon noir", "prix": 600}' http://127.0.0.1:8083/api/produits

      - name: Une sauvegarde arrive dans la minute
        run: |
          for i in $(seq 1 30); do
            sudo find "$RUNNER_TEMP/sauvegardes" -name '*.sql.gz' 2> /dev/null | grep -q . && break
            sleep 5
          done
          sudo ls -l "$RUNNER_TEMP/sauvegardes"
          derniere=$(sudo find "$RUNNER_TEMP/sauvegardes" -name '*.sql.gz' | sort | tail -n 1)
          sudo gunzip -c "$derniere" | grep -q "PostgreSQL database dump"

      - name: Les journaux, si quelque chose a cassé
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 50

      - name: Tout arrêter
        if: always()
        run: docker compose down -v
